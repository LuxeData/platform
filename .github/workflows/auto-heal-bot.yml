name: LuxeData Auto-Heal & Maintenance Bot

on:
  schedule:
    # Runs every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-heal-and-patch:
    name: 🤖 Run Diagnostic & Auto-Fix PR Generator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Get Current Date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # ---------------------------------------------------------
      # 1. Run Automated Security Fixes (Non-Breaking)
      # ---------------------------------------------------------
      - name: Auto-Patch Security Vulnerabilities
        run: |
          echo "Running automated npm audit fix..."
          npm audit fix || true

      # ---------------------------------------------------------
      # 2. Run Automated Lint & Code Style Auto-Fix
      # ---------------------------------------------------------
      - name: Auto-Fix ESLint & Formatting
        run: |
          echo "Running automated ESLint fixes..."
          npx eslint . --fix || true

      # ---------------------------------------------------------
      # 3. Verify Code Still Builds Cleanly Before Raising PR
      # ---------------------------------------------------------
      - name: Validate TypeScript & Next.js Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://extdvvsqcpwekmbaslct.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_KznAuLW0d_1mi7YtDxd3GQ_PRZCkLgl' }}
        run: |
          echo "Verifying build passes with auto-fixes..."
          npm run typecheck
          npm run build

      # ---------------------------------------------------------
      # 4. Automatically Create Pull Request if Changes Exist
      # ---------------------------------------------------------
      - name: Create Automated Maintenance PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(bot): automated security patches and code quality fixes [${{ steps.date.outputs.date }}]"
          branch: "bot/auto-maintenance-${{ steps.date.outputs.date }}"
          delete-branch: true
          title: "🤖 Auto-Maintenance: Security Patches & Code Quality Fixes [${{ steps.date.outputs.date }}]"
          body: |
            ## 🤖 LuxeData Automated Maintenance Bot

            This automated pull request was generated by the repository maintenance bot.

            ### 🛠️ Changes Applied:
            - **Security Fixes**: Applied non-breaking vulnerability patches via `npm audit fix`.
            - **Lint & Syntax Cleanups**: Automated ESLint formatting via `eslint --fix`.
            - **Build Pre-Verification**: Verified clean Next.js static page generation and strict TypeScript typechecking.

            ### 🛡️ Quality Assurance:
            - [x] TypeScript Strict Compilation Passed (`tsc --noEmit`)
            - [x] Next.js Production Build Succeeded (`next build`)
            - [x] Zero Breaking Changes

            *Review the diff and merge when ready.*
          labels: |
            automated-pr
            bot-fix
            maintenance

